<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SQL CheatSheet (PostgreSQL) — Révisions</title>
<script>
(function() {
    try {
        const saved = localStorage.getItem("revision_theme_preference");
        if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
        }
    } catch (e) {}
})();
</script>

<style>
/* ==========================================================================
   PALETTE UTILISATEUR (NEUTRE & ÉPURÉE)
   ========================================================================== */
:root {
    --background-page-color: #191919;
    --white-color: #ffffff;
    --background-element-color: #252525;
    --attachment-tag: #3e3e3e;
    --background-card: #1e1e1e;
    --background-card-label: #2c2c2c;
    --background-card-body: #242424;
    --box-color: #2e2e2e;
    --button-hover-color: #424141;
    --attachment-color: #4a4a4a;
    --text-muted: #9e9e9e;
    --border-subtle: #333333;
    --border-focus: #616161;
    --banniere-color-1: #007806;
    --banniere-color-2: #00c306;
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.28);
    --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.45);
    --mark-bg: rgba(255, 214, 10, 0.25);
    --mark-text: #ffd60a;
    /* Coloration syntaxique (mode sombre) */
    --syntax-keyword: #ff7b72;
    --syntax-builtin: #79c0ff;
    --syntax-var: #ffa657;
    --syntax-string: #7ee787;
    --syntax-comment: #8b949e;
    --syntax-number: #d2a8ff;
    --syntax-punct: #e6edf3;
    color-scheme: dark;
}

:root[data-theme="light"] {
    --background-page-color: #f0f0f0;
    --white-color: #1e1e1e;
    --background-element-color: #ffffff;
    --attachment-tag: #dcdcdc;
    --background-card: #ffffff;
    --background-card-label: #eaeaea;
    --background-card-body: #f7f7f7;
    --box-color: #e4e4e4;
    --button-hover-color: #cccccc;
    --attachment-color: #bcbcbc;
    --text-muted: #5a5a5a;
    --border-subtle: #dddddd;
    --border-focus: #888888;
    --banniere-color-1: #007806;
    --banniere-color-2: #00a008;
    --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.05);
    --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.10);
    --mark-bg: #fff3b0;
    --mark-text: #1e1e1e;
    /* Coloration syntaxique (mode clair) */
    --syntax-keyword: #cf222e;
    --syntax-builtin: #0550ae;
    --syntax-var: #953800;
    --syntax-string: #116329;
    --syntax-comment: #6e7781;
    --syntax-number: #8250df;
    --syntax-punct: #24292f;
    color-scheme: light;
}

/* ==========================================================================
   RESET & BASE
   ========================================================================== */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--background-page-color);
    color: var(--white-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.2s ease, color 0.2s ease;
    -webkit-font-smoothing: antialiased;
}

.page-wrapper {
    width: min(100% - 32px, 1340px);
    margin-inline: auto;
    flex: 1;
    padding-top: 36px;
    padding-bottom: 60px;
}

/* ==========================================================================
   HEADER
   ========================================================================== */
.site-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
}

.brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
}

.brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--background-element-color);
    border: 1px solid var(--attachment-tag);
    display: grid;
    place-items: center;
    color: var(--white-color);
    box-shadow: var(--shadow-card);
}

.brand-logo svg {
    width: 24px;
    height: 24px;
}

.brand-titles h1 {
    font-size: clamp(1.5rem, 2.5vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--white-color);
    line-height: 1.2;
}

.brand-titles p {
    color: var(--text-muted);
    font-size: 0.92rem;
    margin-top: 2px;
}

.header-stats {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-back-btn {
    text-decoration: none;
    background: var(--box-color);
    border: 1px solid var(--border-subtle);
    color: var(--white-color);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
}

.header-back-btn:hover {
    background: var(--button-hover-color);
    border-color: var(--border-focus);
    transform: translateX(-2px);
}

.header-back-btn svg {
    width: 14px;
    height: 14px;
}

.stat-pill {
    background: var(--background-element-color);
    border: 1px solid var(--border-subtle);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
}

.stat-pill strong {
    color: var(--white-color);
}

/* ==========================================================================
   BARRE DE RECHERCHE & FILTRES (STICKY)
   ========================================================================== */
.toolbar-container {
    position: sticky;
    top: 14px;
    z-index: 40;
    margin-bottom: 28px;
}

.toolbar {
    background: color-mix(in srgb, var(--background-card) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--attachment-tag);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.search-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

.search-box {
    flex: 1 1 320px;
    position: relative;
    display: flex;
    align-items: center;
}

.search-box svg {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
}

.search-box input {
    width: 100%;
    padding: 8px 14px 8px 42px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--background-page-color);
    color: var(--white-color);
    font-size: 0.96rem;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.search-box input:focus {
    outline: none;
    border-color: var(--border-focus);
}

.toolbar-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}

.btn {
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--box-color);
    color: var(--white-color);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
}

.btn:hover:not(:disabled) {
    background: var(--button-hover-color);
    border-color: var(--border-focus);
}

.btn:active:not(:disabled) {
    transform: translateY(1px);
}

.btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn[aria-pressed="true"] {
    background: var(--white-color);
    color: var(--background-page-color);
    border-color: var(--white-color);
    font-weight: 600;
}

.btn-primary-green {
    background: var(--banniere-color-1);
    color: #ffffff;
    border-color: var(--banniere-color-1);
    font-weight: 600;
}

.btn-primary-green:hover:not(:disabled) {
    background: var(--banniere-color-2);
    border-color: var(--banniere-color-2);
    color: #ffffff;
}

/* Pilules de catégories */
.category-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-top: 4px;
}

.cat-pill {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--background-element-color);
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s ease;
    font-family: inherit;
}

.cat-pill:hover {
    color: var(--white-color);
    background: var(--box-color);
}

.cat-pill.active {
    background: var(--white-color);
    color: var(--background-page-color);
    font-weight: 600;
}

/* ==========================================================================
   GRILLE FLEX-MASONRY (ZÉRO VIDE, ZÉRO BUG DE COLONNE CSS)
   ========================================================================== */
.masonry-board {
    display: grid;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
    gap: 20px;
    align-items: start;
}

.masonry-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
}

/* ==========================================================================
   CARTES DE COMMANDES
   ========================================================================== */
.card {
    background: var(--background-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-card);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.card:hover {
    border-color: var(--border-focus);
    box-shadow: var(--shadow-hover);
}

.card.pinned {
    border-color: var(--white-color);
    box-shadow: 0 0 0 1px var(--white-color), var(--shadow-card);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-subtle);
}

.card-title-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.card-title {
    font-size: 1.22rem;
    font-weight: 700;
    color: var(--white-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: -0.02em;
    word-break: break-word;
}

.badge-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.cat-badge {
    background: var(--background-card-label);
    color: var(--white-color);
    border: 1px solid var(--attachment-tag);
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.kind-badge {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-family: system-ui, sans-serif;
}

.pin-btn {
    background: var(--background-element-color);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
}

.pin-btn:hover {
    color: var(--white-color);
    border-color: var(--border-focus);
    background: var(--box-color);
}

.card.pinned .pin-btn {
    background: var(--white-color);
    color: var(--background-page-color);
    border-color: var(--white-color);
}

.card-desc {
    color: var(--white-color);
    opacity: 0.92;
    font-size: 0.94rem;
    line-height: 1.55;
}

.section-label {
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-top: 4px;
    margin-bottom: 6px;
}

/* Liste d'options structurée */
.options-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--background-card-body);
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
}

.opt-row {
    display: grid;
    grid-template-columns: minmax(110px, auto) 1fr;
    gap: 12px;
    align-items: flex-start;
    font-size: 0.88rem;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border-subtle);
}

.opt-row:last-child {
    padding-bottom: 0;
    border-bottom: none;
}

.opt-key {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    color: var(--white-color);
    background: var(--box-color);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.84rem;
    justify-self: start;
    border: 1px solid var(--attachment-tag);
    white-space: pre;
    tab-size: 4;
    line-height: 1.45;
    max-width: 100%;
    overflow-x: auto;
}

.opt-val {
    color: var(--white-color);
    opacity: 0.88;
    white-space: pre-wrap;
    line-height: 1.45;
}

/* Exemples avec bouton copier */
.examples-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.example-item {
    background: var(--background-card-body);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.example-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.example-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.87rem;
    font-weight: 600;
    color: var(--white-color);
    white-space: pre;
    tab-size: 4;
    line-height: 1.5;
    overflow-x: auto;
    max-width: 100%;
}

.copy-btn {
    background: var(--box-color);
    border: 1px solid var(--attachment-tag);
    color: var(--text-muted);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.74rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
    margin-top: 1px;
}

.copy-btn:hover {
    color: var(--white-color);
    background: var(--button-hover-color);
}

.copy-btn.copied {
    background: var(--banniere-color-1);
    color: #ffffff;
    border-color: var(--banniere-color-1);
}

.example-exp {
    font-size: 0.84rem;
    color: var(--text-muted);
}

/* Tableaux intégrés aux cartes */
.table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    background: var(--background-card-body);
    margin: 4px 0;
}

.table-wrap table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
}

.table-wrap caption {
    text-align: left;
    padding: 8px 10px;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-subtle);
    background: var(--background-element-color);
}

.table-wrap th, .table-wrap td {
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border-subtle);
    vertical-align: top;
}

.table-wrap thead th {
    background: var(--box-color);
    color: var(--white-color);
    font-weight: 600;
}

.table-wrap tbody tr:last-child th,
.table-wrap tbody tr:last-child td {
    border-bottom: none;
}

/* Notes & Alertes */
.card-note {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    background: var(--background-element-color);
    border-left: 3px solid var(--attachment-color);
    color: var(--white-color);
    opacity: 0.92;
}

.card-note.warning {
    border-left-color: #d97706;
    background: color-mix(in srgb, #d97706 10%, var(--background-element-color));
}

mark {
    background: var(--mark-bg);
    color: var(--mark-text);
    padding: 0 3px;
    border-radius: 3px;
}

.empty-state {
    background: var(--background-card);
    border: 1px dashed var(--attachment-tag);
    border-radius: 12px;
    padding: 48px 20px;
    text-align: center;
    color: var(--text-muted);
    margin: 20px 0;
}

/* ==========================================================================
   SECTIONS ASTUCES (ACCORDÉONS)
   ========================================================================== */
.tips-section {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

details.tips {
    background: var(--background-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 18px 22px;
    box-shadow: var(--shadow-card);
}

details.tips summary {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-weight: 600;
}

details.tips summary::-webkit-details-marker {
    display: none;
}

details.tips summary h2 {
    font-size: 1.1rem;
    color: var(--white-color);
    font-weight: 600;
}

details.tips summary::after {
    content: "Afficher";
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--box-color);
    border: 1px solid var(--attachment-tag);
    color: var(--text-muted);
}

details.tips[open] summary::after {
    content: "Masquer";
}

details.tips[open] summary {
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border-subtle);
}

details.tips h3 {
    font-size: 0.98rem;
    color: var(--white-color);
    margin: 16px 0 8px;
}

details.tips p, details.tips li {
    font-size: 0.92rem;
    color: var(--white-color);
    opacity: 0.9;
    margin: 6px 0;
}

details.tips ul {
    padding-left: 20px;
}

details.tips code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: var(--background-card-body);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
    font-size: 0.86em;
}

details.tips .note {
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--background-card-body);
    border-left: 3px solid var(--border-focus);
    border-radius: 0 8px 8px 0;
}

/* ==========================================================================
   MODALE D'AFFICHAGE AGRANDI (AVEC ARRIÈRE-PLAN FLOUTÉ)
   ========================================================================== */
dialog#card-modal {
    width: min(92vw, 760px);
    max-height: 88vh;
    margin: auto;
    padding: 0;
    border: 1px solid var(--attachment-color);
    border-radius: 16px;
    background: var(--background-card);
    color: var(--white-color);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    overflow: hidden;
}

dialog#card-modal::backdrop {
    background: rgba(10, 10, 10, 0.62);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    animation: backdropFade 0.2s ease;
}


dialog#card-modal[open] {
    animation: modalZoom 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Nouveau : Empêcher le défilement du corps (body) quand une modale est ouverte */
body:has(dialog#card-modal[open]) {
    overflow: hidden;
}

@keyframes modalZoom {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes backdropFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--background-element-color);
    border-bottom: 1px solid var(--border-subtle);
}

.modal-header-bar span {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
}

.modal-close-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--attachment-tag);
    background: var(--box-color);
    color: var(--white-color);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
}

.modal-close-btn:hover {
    background: var(--button-hover-color);
}

.modal-body-container {
    padding: 24px;
    max-height: calc(88vh - 60px);
    overflow-y: auto;
}

.modal-body-container .card {
    border: none;
    box-shadow: none;
    padding: 0;
    cursor: default;
    background: transparent;
}

.modal-body-container .card-title {
    font-size: 1.5rem;
}

.modal-body-container .card-desc {
    font-size: 1.02rem;
}

.modal-body-container .pin-btn {
    display: none;
}

/* ==========================================================================
   FOOTER AVEC BOUTONS CLASSIQUES (THÈME + TÉLÉCHARGEMENT)

}

        break-inside: avoid;
        margin-bottom: 16px;
        box-shadow: none;
        border: 1px solid #ccc;

}

}

// Normalisation sans accents pour une recherche souple
function norm(str) {
    return (str || "").normalize("NFD").replace(/\p{M}/gu, "").toLocaleLowerCase("fr");
}

function escapeRegExp(val) {
    return val.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

const ACCENT_MAP = {
    "a": "[aàáâãäå]",
    "e": "[eèéêë]",
    "i": "[iìíîï]",
    "o": "[oòóôõö]",
    "u": "[uùúûü]",
    "c": "[cç]",
    "n": "[nñ]",
    "y": "[yýÿ]"
};

function buildAccentPattern(term) {
    const normTerm = term.normalize("NFD").replace(/\p{M}/gu, "");
    let pattern = "";
    for (const ch of normTerm) {
        const lower = ch.toLowerCase();
        if (ACCENT_MAP[lower]) {
            pattern += ACCENT_MAP[lower];
        } else if (/[.*+?^${}()|[\]\\]/.test(ch)) {
            pattern += "\\" + ch;
        } else {
            pattern += ch;
        }
    }
    return pattern;
}

function highlightText(container, text, query) {
    if (text == null || text === "") return;
    const str = String(text);
    const terms = (query || "").trim().split(/\s+/).filter(Boolean);
    if (!terms.length) {
        container.appendChild(document.createTextNode(str));
        return;
    }
    let regex;
    try {
        const patterns = terms.map(buildAccentPattern).filter(Boolean);
        if (!patterns.length) {
            container.appendChild(document.createTextNode(str));
            return;
        }
        regex = new RegExp("(" + patterns.join("|") + ")", "gi");
    } catch (e) {
        container.appendChild(document.createTextNode(str));
        return;
    }

    let lastIdx = 0;
    try {
        for (const match of str.matchAll(regex)) {
            const idx = match.index;
            if (idx < lastIdx) continue;
            if (idx > lastIdx) {
                container.appendChild(document.createTextNode(str.slice(lastIdx, idx)));
            }
            const mark = document.createElement("mark");
            mark.textContent = match[0];
            container.appendChild(mark);
            lastIdx = idx + match[0].length;
        }
        if (lastIdx < str.length) {
            container.appendChild(document.createTextNode(str.slice(lastIdx)));
        }
    } catch (e) {
        if (lastIdx < str.length) {
            container.appendChild(document.createTextNode(str.slice(lastIdx)));
        }
    }
}

// Coloration syntaxique pour SQL
function tokenizeSql(code) {
    const tokenRegex = /(--[^\n]*)|('(?:''|[^'])*')|(\b(?:SELECT|FROM|WHERE|GROUP\s+BY|HAVING|ORDER\s+BY|LIMIT|OFFSET|JOIN|INNER\s+JOIN|LEFT\s+JOIN|RIGHT\s+JOIN|FULL\s+JOIN|ON|AS|DISTINCT|INSERT\s+INTO|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE\s+TABLE|CREATE\s+VIEW|CREATE\s+INDEX|CREATE|ALTER|DROP|TABLE|VIEW|INDEX|WITH|UNION|INTERSECT|EXCEPT|CASE|WHEN|THEN|ELSE|END|AND|OR|NOT|IN|IS\s+NULL|IS\s+NOT\s+NULL|IS|NULL|LIKE|ILIKE|BETWEEN|EXISTS|PRIMARY\s+KEY|FOREIGN\s+KEY|REFERENCES|DEFAULT|CHECK|BEGIN|COMMIT|ROLLBACK|RETURNING)\b)|(\b(?:COUNT|SUM|AVG|MIN|MAX|COALESCE|NULLIF|TO_CHAR|NOW|DATE_TRUNC|CONCAT|SUBSTRING|LOWER|UPPER|ROUND|ROW_NUMBER|RANK|DENSE_RANK|LEAD|LAG)\b)|(\b\d+(?:\.\d+)?\b)/gi;

    let lastIdx = 0;
    const result = [];
    let match;
    while ((match = tokenRegex.exec(code)) !== null) {
        if (match.index > lastIdx) {
            result.push({ type: "text", val: code.slice(lastIdx, match.index) });
        }
        const [full, comment, str, keyword, func, num] = match;
        if (comment) result.push({ type: "comment", val: comment });
        else if (str) result.push({ type: "string", val: str });
        else if (keyword) result.push({ type: "keyword", val: keyword });
        else if (func) result.push({ type: "builtin", val: func });
        else if (num) result.push({ type: "number", val: num });
        lastIdx = tokenRegex.lastIndex;
    }
    if (lastIdx < code.length) {
        result.push({ type: "text", val: code.slice(lastIdx) });
    }
    return result;
}

function renderHighlightedCode(container, code, rawQuery, lang = "sql") {
    const tokens = tokenizeSql(code);
    tokens.forEach(tok => {
        if (tok.type === "text") {
            highlightText(container, tok.val, rawQuery);
        } else {
            const span = document.createElement("span");
            span.className = "hl-" + tok.type;
            highlightText(span, tok.val, rawQuery);
            container.appendChild(span);
        }
    });
}

// Construction d'un tableau HTML pour les cartes qui en possèdent
function buildTableElement(tableData, rawQuery) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    const table = document.createElement("table");
    if (tableData.caption) {
        const cap = document.createElement("caption");
        highlightText(cap, tableData.caption, rawQuery);
        table.appendChild(cap);
    }
    const thead = document.createElement("thead");
    const trHead = document.createElement("tr");
    tableData.headers.forEach(h => {
        const th = document.createElement("th");
        highlightText(th, h, rawQuery);
        trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    tableData.rows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach((cellText, idx) => {
            const cell = document.createElement(idx === 0 ? "th" : "td");
            highlightText(cell, cellText, rawQuery);
            tr.appendChild(cell);
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    return wrap;
}

// Copie dans le presse-papiers
function copyToClipboard(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = "Copié";
        btn.classList.add("copied");
        setTimeout(() => {
            btn.textContent = orig;
            btn.classList.remove("copied");
        }, 1300);
    }).catch(() => {
        window.prompt("Copiez la commande :", text);
    });
}

// Persistance des cartes épinglées
const PINNED_STORAGE_KEY = "pinned_sql_commands";

function loadPinned() {
    try {
        const saved = localStorage.getItem(PINNED_STORAGE_KEY);
        if (saved) {
            const arr = JSON.parse(saved);
            if (Array.isArray(arr)) {
                arr.forEach(name => pinnedSet.add(name));
            }
        }
    } catch (e) {}
}

function savePinned() {
    try {
        localStorage.setItem(PINNED_STORAGE_KEY, JSON.stringify(Array.from(pinnedSet)));
    } catch (e) {}
}

// Création d'une carte DOM complète
function createCardElement(cmd, rawQuery, isModal = false) {
    const card = document.createElement("article");
    card.className = "card" + (pinnedSet.has(cmd.name) ? " pinned" : "");
    if (isModal) {
        card.style.cursor = "default";
        card.style.boxShadow = "none";
        card.style.border = "none";
        card.style.background = "transparent";
        card.style.padding = "0";
    }

    // En-tête de la carte
    const header = document.createElement("div");
    header.className = "card-header";

    const titleGroup = document.createElement("div");
    titleGroup.className = "card-title-group";

    const title = document.createElement("h2");
    title.className = "card-title";
    highlightText(title, cmd.name, rawQuery);
    titleGroup.appendChild(title);

    const kind = commandKinds[cmd.name];
    if (kind) {
        const kBadge = document.createElement("span");
        kBadge.className = "kind-badge";
        kBadge.textContent = kind;
        if (kindHints[kind]) kBadge.title = kindHints[kind];
        titleGroup.appendChild(kBadge);
    }

    const badgeGroup = document.createElement("div");
    badgeGroup.className = "badge-group";

    const cBadge = document.createElement("span");
    cBadge.className = "cat-badge";
    cBadge.textContent = cmd.category;
    badgeGroup.appendChild(cBadge);

    const pinBtn = document.createElement("button");
    pinBtn.type = "button";
    pinBtn.className = "pin-btn";
    pinBtn.title = pinnedSet.has(cmd.name) ? "Retirer de la sélection" : "Épingler cette carte pour réviser";
    pinBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>';
    pinBtn.onclick = (e) => {
        e.stopPropagation();
        if (pinnedSet.has(cmd.name)) {
            pinnedSet.delete(cmd.name);
        } else {
            pinnedSet.add(cmd.name);
        }
        savePinned();
        updatePinnedUI();
        if (pinnedOnly) {
            renderBoard();
        } else {
            card.classList.toggle("pinned", pinnedSet.has(cmd.name));
        }
    };
    badgeGroup.appendChild(pinBtn);

    header.append(titleGroup, badgeGroup);
    card.appendChild(header);

    // Description
    const desc = document.createElement("p");
    desc.className = "card-desc";
    highlightText(desc, cmd.description, rawQuery);
    card.appendChild(desc);

    // Tableaux éventuels
    if (cmd.tables && cmd.tables.length) {
        cmd.tables.forEach(t => card.appendChild(buildTableElement(t, rawQuery)));
    }

    // Options
    if (cmd.options && cmd.options.length) {
        const optWrap = document.createElement("div");
        const optTitle = document.createElement("div");
        optTitle.className = "section-label";
        optTitle.textContent = "Options & Syntaxe";
        optWrap.appendChild(optTitle);

        const optGrid = document.createElement("div");
        optGrid.className = "options-grid";
        cmd.options.forEach(([optKey, optDesc]) => {
            const row = document.createElement("div");
            row.className = "opt-row";
            const k = document.createElement("code");
            k.className = "opt-key";
            renderHighlightedCode(k, optKey, rawQuery, "sql");
            const v = document.createElement("span");
            v.className = "opt-val";
            highlightText(v, optDesc, rawQuery);
            row.append(k, v);
            optGrid.appendChild(row);
        });
        optWrap.appendChild(optGrid);
        card.appendChild(optWrap);
    }

    // Exemples
    if (cmd.examples && cmd.examples.length) {
        const exWrap = document.createElement("div");
        const exTitle = document.createElement("div");
        exTitle.className = "section-label";
        exTitle.textContent = "Exemples pratiques";
        exWrap.appendChild(exTitle);

        const exList = document.createElement("div");
        exList.className = "examples-list";
        cmd.examples.forEach(([exCode, exExp]) => {
            const item = document.createElement("div");
            item.className = "example-item";

            const top = document.createElement("div");
            top.className = "example-top";

            const codeEl = document.createElement("code");
            codeEl.className = "example-code";
            renderHighlightedCode(codeEl, exCode, rawQuery, "sql");

            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "copy-btn";
            copyBtn.textContent = "Copier";
            copyBtn.onclick = (e) => {
                e.stopPropagation();
                copyToClipboard(copyBtn, exCode);
            };

            top.append(codeEl, copyBtn);

            const expEl = document.createElement("span");
            expEl.className = "example-exp";
            highlightText(expEl, exExp, rawQuery);

            item.append(top, expEl);
            exList.appendChild(item);
        });
        exWrap.appendChild(exList);
        card.appendChild(exWrap);
    }

    // Note / Avertissement
    if (cmd.warning || cmd.tip) {
        const note = document.createElement("div");
        note.className = "card-note" + (cmd.warning ? " warning" : "");
        highlightText(note, cmd.warning || cmd.tip, rawQuery);
        card.appendChild(note);
    }

    // Clic sur la carte -> Ouverture de la modale si pas en mode modale, hors boutons/liens/code et sans sélection de texte
    if (!isModal) {
        card.addEventListener("click", (e) => {
            if (e.target.closest("button, a, input, code")) return;
            const selection = window.getSelection();
            if (selection && selection.toString().trim().length > 0) return;
            openCardModal(cmd, rawQuery);
        });
    }

    return card;
}

function openCardModal(cmd, rawQuery) {
    modalBody.replaceChildren();
    const detailedCard = createCardElement(cmd, rawQuery, true);
    modalBody.appendChild(detailedCard);
    if (!modal.open) {
        modal.showModal();
    }
}

function updatePinnedUI() {
    pinnedOnlyBtn.textContent = `Sélection (${pinnedSet.size})`;
    pinnedOnlyBtn.disabled = pinnedSet.size === 0 && !pinnedOnly;
    pinnedOnlyBtn.setAttribute("aria-pressed", String(pinnedOnly));
}

// Distribution intelligente dans N colonnes indépendantes :
// Chaque nouvelle carte est placée dans la colonne la plus courte -> ZÉRO TROU VISUEL
function renderBoard() {
    const rawQuery = searchInput.value.trim();
    const queryNorm = norm(rawQuery);
    const terms = queryNorm.split(/\s+/).filter(Boolean);

    const filtered = commands.filter(cmd => {
        if (activeCategory && cmd.category !== activeCategory) return false;
        if (pinnedOnly && !pinnedSet.has(cmd.name)) return false;
        if (!terms.length) return true;

        const aliases = (searchAliases[cmd.name] || []).join(" ");
        const haystack = titleOnly
            ? norm(cmd.name)
            : norm(JSON.stringify(cmd) + " " + aliases);
        return terms.every(t => haystack.includes(t));
    });

    updatePinnedUI();
    countEl.innerHTML = `<strong>${filtered.length}</strong> fiche${filtered.length > 1 ? "s" : ""} affichée${filtered.length > 1 ? "s" : ""}`;

    board.replaceChildren();

    if (filtered.length === 0) {
        board.style.display = "block";
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Aucune commande ne correspond à votre recherche. Essayez un autre terme ou réinitialisez les filtres.";
        board.appendChild(empty);
        return;
    }

    board.style.display = "grid";
    const numCols = getColumnCount();
    board.style.setProperty("--cols", numCols);

    const colElements = [];
    const colHeights = [];
    for (let i = 0; i < numCols; i++) {
        const col = document.createElement("div");
        col.className = "masonry-col";
        board.appendChild(col);
        colElements.push(col);
        colHeights.push(0);
    }

    // Répartition équilibrée selon le poids estimé du contenu de chaque carte
    filtered.forEach(cmd => {
        const cardEl = createCardElement(cmd, rawQuery);
        let minColIndex = 0;
        for (let i = 1; i < numCols; i++) {
            if (colHeights[i] < colHeights[minColIndex]) {
                minColIndex = i;
            }
        }
        colElements[minColIndex].appendChild(cardEl);
        const estimatedWeight = 120
            + (cmd.description ? cmd.description.length * 0.5 : 0)
            + (cmd.options ? cmd.options.length * 36 : 0)
            + (cmd.examples ? cmd.examples.length * 52 : 0)
            + (cmd.tables ? cmd.tables.length * 160 : 0)
            + (cmd.warning || cmd.tip ? 60 : 0);
        colHeights[minColIndex] += estimatedWeight;
    });
}

// Événements de la barre d'outils
searchInput.addEventListener("input", renderBoard);

titleOnlyBtn.addEventListener("click", () => {
    titleOnly = !titleOnly;
    titleOnlyBtn.setAttribute("aria-pressed", String(titleOnly));
    renderBoard();
});

pinnedOnlyBtn.addEventListener("click", () => {
    pinnedOnly = !pinnedOnly;
    renderBoard();
});

resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    activeCategory = "";
    titleOnly = false;
    pinnedOnly = false;
    pinnedSet.clear();
    savePinned();
    titleOnlyBtn.setAttribute("aria-pressed", "false");
    renderCategories();
    renderBoard();
    searchInput.focus();
});

// Redimensionnement réactif des colonnes
let lastColCount = getColumnCount();
window.addEventListener("resize", () => {
    const currentCols = getColumnCount();
    if (currentCols !== lastColCount) {
        lastColCount = currentCols;
        renderBoard();
    }
});

// Gestion de la modale
modalCloseBtn.addEventListener("click", () => modal.close());
modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.close();
});

// Raccourcis clavier (Navigation rapide examen)
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        if (modal && modal.open) {
            modal.close();
        } else if (document.activeElement === searchInput) {
            if (searchInput.value) {
                searchInput.value = "";
                renderBoard();
            }
            searchInput.blur();
        }
        return;
    }

    const isSearchShortcut = (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName))
        || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k");

    if (isSearchShortcut) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
    }
});

// Gestion du thème avec persistance localStorage
const THEME_STORAGE_KEY = "revision_theme_preference";

function syncThemeButtonLabel() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    themeToggleBtn.textContent = isLight ? "Passer au thème sombre" : "Passer au thème clair";
}

themeToggleBtn.addEventListener("click", () => {
    const root = document.documentElement;
    const isLight = root.getAttribute("data-theme") === "light";
    const nextTheme = isLight ? "dark" : "light";
    root.setAttribute("data-theme", nextTheme);
    try {
        localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
    } catch (e) {}
    syncThemeButtonLabel();
});

topBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
});

// Téléchargement autonome hors-ligne propre
downloadBtn.addEventListener("click", () => {
    const clone = document.documentElement.cloneNode(true);
    const boardClone = clone.querySelector("#results-board");
    if (boardClone) boardClone.replaceChildren();
    const pillsClone = clone.querySelector("#category-pills");
    if (pillsClone) pillsClone.replaceChildren();
    clone.querySelectorAll("dialog[open]").forEach(d => d.removeAttribute("open"));
    const searchClone = clone.querySelector("#search-input");
    if (searchClone) searchClone.value = "";
    const htmlStr = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cheatsheet-sql.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

// Lancement initial
loadPinned();
syncThemeButtonLabel();
renderCategories();
renderBoard();
</script>
